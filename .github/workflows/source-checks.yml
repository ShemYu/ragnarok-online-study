name: Source checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  source-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check public source inventory
        run: python3 tools/check_public_tree.py
      - name: Check tracked Python and JavaScript syntax
        run: python3 tools/check_source.py
      - name: Install pinned source linter
        run: python3 -m pip install ruff==0.16.9
      - name: Check Python errors and unused code
        run: ruff check --config ruff.toml --no-cache tools tests
      - name: Run authored motion and quest regressions
        run: >-
          node --test
          tools/character-lab/tests/modular-motion.test.mjs
          tools/character-lab/tests/modular-engine.test.mjs
          tests/renewal/quest_text_projection.test.mjs
          tests/renewal/quest_registration_tail.test.mjs
      - name: Check Chapter 1 source and progression models
        run: python3 -I -B tools/renewal/test_chapter1_entry.py
